app:
  name: mail-sync-service
  version: 1.0.0
http:
  address: ":8080"
log:
  level: info
postgres:
  max_pool_size: 10
redis:
  address: "localhost:6379"
  password: ""
  db: 0
kafka:
  brokers: ["localhost:9092"]
  topic: "mailbox-events"
  consumer_group: "mail-sync-group"
oauth:
  redirect_uri: "http://localhost:8080/api/v1/auth/callback"
sync:
  interval: 5m
  retry_max: 3
  retry_backoff: 2s